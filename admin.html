<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakob | Admin Dashboard</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 기존 공용 CSS 및 어드민 전용 CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">

    <!-- 기본 파비콘 설정 -->
    <link rel="icon" type="image/png" sizes="32x32" href="../img/icons/favicon.png">
    <link rel="shortcut icon" href="../img/icons/favicon.ico" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://mojcgizzrwsatgsvboib.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vXeVkey0aLcuVxeLws219A_YPEz_Ze6';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Supabase 초기화 오류:', e);
        }

        // 플랫폼 이름별 아이콘 파일 매핑
        const iconMap = {
            'X (Realism)': 'x.svg',
            'X (Casual)': 'x.svg',
            'Instagram': 'instagram.svg',
            'Pixiv': 'pixiv.svg',
            'Cara': 'cara.svg',
            'Bluesky': 'bluesky.svg',
            'ArtStation': 'artstation.svg',
            'Threads': 'threads.svg',
            'Reddit': 'reddit.svg',
            'YouTube': 'youtube.svg',
            'Chzzk': 'chzzk.svg',
            'Twitch': 'twitch.svg',
            'VGen': 'vgen.svg',
            'Pixiv Request': 'pixiv.svg',
            'Crepe': 'crepe.svg',
            'ARTMUG': 'artmug.svg',
            'KakaoTalk': 'kakaotalk.svg',
            'Discord': 'discord.svg'
        };

        async function loadAdminData() {
            // 1. 초기 렌더링 시에도 Today 높은순(내림차순) 정렬이 반영되도록 처리
            const initialList = Object.keys(iconMap).map(name => ({
                platform_name: name,
                today_views: 0,
                total_views: 0
            })).sort((a, b) => b.today_views - a.today_views);

            renderPlatforms(initialList);

            if (!supabaseClient) return;

            const { data: platforms, error } = await supabaseClient
                .from('platform_views')
                .select('*');

            if (error) {
                console.error('데이터를 불러오지 못했습니다:', error);
                return;
            }

            if (!platforms || platforms.length === 0) {
                console.warn('Supabase에 데이터가 없습니다.');
                return;
            }

            // 2. 'site_visit'(사이트 방문자 데이터)와 우측 SNS 플랫폼 데이터를 분리
            const siteVisitData = platforms.find(p => p.id === 'site_visit') || { today_views: 0, total_views: 0 };
            const snsPlatforms = platforms.filter(p => p.id !== 'site_visit');

            // 3. 좌측 카드에 사이트 방문자 수 독립 반영
            document.getElementById('total-today-views').textContent = (siteVisitData.today_views || 0).toLocaleString();
            document.getElementById('total-all-views').textContent = (siteVisitData.total_views || 0).toLocaleString();

            // 4. 데이터를 받아온 직후 기본적으로 'Today 높은순'으로 정렬
            snsPlatforms.sort((a, b) => {
                const todayA = a.today_views !== undefined ? a.today_views : (a.today || 0);
                const todayB = b.today_views !== undefined ? b.today_views : (b.today || 0);
                return todayB - todayA;
            });

            // 5. 우측 상세 리스트에 정렬된 SNS 플랫폼 렌더링
            renderPlatforms(snsPlatforms);

            // 6. 국가별 방문자 통계 데이터 불러오기
            loadCountryStats();
        }

        async function loadCountryStats() {
            const { data, error } = await supabaseClient
                .from('visitor_ips')
                .select('country');

            if (error) {
                console.error('국가 통계 불러오기 실패:', error);
                return;
            }

            const countryCounts = {};
            data.forEach(row => {
                const c = row.country ? row.country.toUpperCase() : 'UNKNOWN';
                countryCounts[c] = (countryCounts[c] || 0) + 1;
            });

            // 방문수 많은 순으로 정렬
            const sortedCountries = Object.entries(countryCounts).sort((a, b) => b[1] - a[1]);

            const container = document.getElementById('countryListContainer');
            container.innerHTML = '';

            if (sortedCountries.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-sub); font-size: 0.85rem; padding: 15px;">기록된 국가 데이터가 없습니다.</div>';
                return;
            }

            sortedCountries.forEach(([country, count]) => {
                const item = document.createElement('div');
                item.className = 'country-item';
                item.innerHTML = `
                    <div class="country-name">
                        <i class="fa-solid fa-globe"></i> ${country}
                    </div>
                    <div class="country-count">${count.toLocaleString()}명</div>
                `;
                container.appendChild(item);
            });
        }

        function renderPlatforms(platforms) {
            const container = document.getElementById('snsListContainer');
            container.innerHTML = ''; 

            platforms.forEach(p => {
                const name = p.platform_name || p.name || 'Unknown';
                const today = p.today_views !== undefined ? p.today_views : (p.today || 0);
                const total = p.total_views !== undefined ? p.total_views : (p.total || 0);

                const iconFile = iconMap[name] || 'default.svg';

                const item = document.createElement('div');
                item.className = 'sns-item';
                item.setAttribute('data-name', name);
                item.setAttribute('data-today', today);
                item.setAttribute('data-total', total);

                item.innerHTML = `
                    <div class="sns-info-left">
                        <div class="sns-icon-box"><img src="img/icons/${iconFile}" alt="${name}"></div>
                        <div class="sns-name">${name}</div>
                    </div>
                    <div class="sns-counts-right">
                        <span class="count-num today">${today.toLocaleString()}</span>
                        <span class="count-num">${total.toLocaleString()}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</head>

<body>

    <!-- 배경 레이어 -->
    <canvas id="snow-canvas"></canvas>
    <div class="bg-layer bg-dark-snow"></div>
    <div class="bg-layer bg-dark-rain"></div>
    <div class="bg-layer bg-dark-none"></div>
    <div class="bg-layer bg-light-snow"></div>
    <div class="bg-layer bg-light-rain"></div>
    <div class="bg-layer bg-light-none"></div>

    <div class="container" style="max-width: 1100px;">

        <!-- 상단 헤더 영역 -->
        <div class="admin-header-row">
            <div class="admin-title">
                <i class="fa-solid fa-chart-line"></i> 관리자 대시보드
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="weather-toggle" class="theme-btn" aria-label="Toggle Weather" title="날씨 변경">
                    <i class="fa-solid fa-snowflake"></i>
                </button>
                <a href="index.html" class="back-home-btn">
                    <i class="fa-solid fa-arrow-left"></i> 홈으로 돌아가기
                </a>
            </div>
        </div>

        <!-- 대시보드 메인 콘텐츠 그리드 -->
        <div class="dashboard-grid">
            
            <!-- [좌측] 열 영역 (사이트 방문수 카드 + 국가별 통계 카드 세로 배치) -->
            <div class="left-column-wrapper" style="display: flex; flex-direction: column; gap: 20px;">
                <!-- 오늘 조회수 (사이트 방문자 전용) -->
                <div class="admin-card total-views-card">
                    <div class="main-today-label">
                        <i class="fa-solid fa-fire"></i> 오늘 사이트 방문수
                    </div>
                    <div class="main-today-value" id="total-today-views">0</div>
                    
                    <div class="total-views-divider"></div>
                    
                    <div class="sub-total-wrapper">
                        <span>누적 총 방문수:</span>
                        <strong id="total-all-views">0</strong>
                    </div>
                </div>

                <!-- 🌟 [추가됨] 국가별 방문자 통계 카드 -->
                <div class="admin-card country-stats-card">
                    <div class="sns-stats-top-container" style="margin-bottom: 12px;">
                        <div class="sns-stats-title">
                            <i class="fa-solid fa-earth-americas"></i> 국가별 방문 통계
                        </div>
                    </div>
                    <div class="country-list" id="countryListContainer">
                        <!-- 동적 생성 -->
                    </div>
                </div>
            </div>

            <!-- [우측] 각 SNS별 상세 조회수 (플랫폼 클릭 집계 전용) -->
            <div class="admin-card">
                <div class="sns-stats-top-container">
                    <div class="sns-stats-title">
                        <i class="fa-solid fa-chart-pie"></i> 플랫폼별 상세 조회수
                    </div>
                    <div class="sort-dropdown-wrapper">
                        <button class="sort-btn" id="sortMenuBtn" onclick="toggleSortMenu()">
                            <i class="fa-solid fa-arrow-down-wide-short"></i> <span id="currentSortLabel">Today 높은순</span>
                        </button>
                        <div class="sort-menu" id="sortMenu">
                            <button class="sort-menu-item" onclick="setSort('today')">Today 높은순</button>
                            <button class="sort-menu-item" onclick="setSort('total')">Total 높은순</button>
                            <button class="sort-menu-item" onclick="setSort('name')">이름순</button>
                        </div>
                    </div>
                </div>

                <div class="sns-table-header">
                    <span>플랫폼</span>
                    <div class="sns-header-right">
                        <span>Today</span>
                        <span>Total</span>
                    </div>
                </div>
                
                <!-- 자바스크립트가 동적으로 생성하는 영역 -->
                <div class="sns-list" id="snsListContainer"></div>
            </div>

        </div>

        <footer>
            © 2026 JakobArtstation. Admin Control Panel.
        </footer>
    </div>

    <script src="js/main.js"></script>

    <script>
        function toggleSortMenu() {
            const menu = document.getElementById('sortMenu');
            menu.classList.toggle('active');
        }

        window.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.sort-dropdown-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('sortMenu').classList.remove('active');
            }
        });

        function setSort(criteria) {
            const container = document.getElementById('snsListContainer');
            const itemsArray = Array.from(container.getElementsByClassName('sns-item'));
            const labelSpan = document.getElementById('currentSortLabel');
            
            const labels = {
                'today': 'Today 높은순',
                'total': 'Total 높은순',
                'name': '이름순'
            };
            labelSpan.textContent = labels[criteria];
            document.getElementById('sortMenu').classList.remove('active');

            itemsArray.sort((a, b) => {
                if (criteria === 'today') {
                    return parseInt(b.dataset.today) - parseInt(a.dataset.today);
                } else if (criteria === 'total') {
                    return parseInt(b.dataset.total) - parseInt(a.dataset.total);
                } else if (criteria === 'name') {
                    return a.dataset.name.localeCompare(b.dataset.name);
                } else {
                    return 0; 
                }
            });

            itemsArray.forEach(item => container.appendChild(item));
        }
    </script>
</body>
</html>
